<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Wanted Sans (SIL OFL) — 가변 + 동적 서브셋. 한글 폰트는 통짜로 받으면 수 MB 라
         split 빌드로 필요한 글리프 범위만 내려받는다.
         **여기(문서)에서 로드하는 이유**: 라이브러리 CSS 는 폰트를 import 하지 않는다 —
         소비 프로젝트가 자기 폰트 전략을 정할 수 있어야 하고, 라이브러리는 스택 이름만 선언한다. -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin="anonymous" />
    <!-- crossorigin 을 걸지 않는다. 아래 stylesheet 링크는 no-cors 로 받아 가는데
         preload 에만 crossorigin 이 있으면 두 요청의 자격증명 모드가 달라
         프리로드가 버려지고 같은 CSS 를 두 번 받는다(브라우저가 경고로 알려준다).
         preconnect 의 crossorigin 은 별개다 — 그쪽은 CSS 가 아니라 폰트 파일용이고 폰트는 항상 CORS 다. -->
    <link rel="preload" as="style"
          href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.3/packages/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.min.css" />
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.3/packages/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.min.css" />

    <title>juhwan-ui</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
